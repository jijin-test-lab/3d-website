<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jijin's Wallpapers</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 40px 10%;
        }

        h1 {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #888;
            margin-bottom: 50px;
        }

        /* The Grid System */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        /* The Wallpaper Card */
        .wallpaper-card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s;
        }

        .wallpaper-card:hover {
            transform: scale(1.02);
        }

        .wallpaper-card img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            display: block;
        }

        /* The Download Button */
        .download-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 255, 204, 0.9);
            color: #000;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            opacity: 0; 
            transition: opacity 0.3s;
        }

        .wallpaper-card:hover .download-btn {
            opacity: 1;
        }
    </style>
</head>
<body>

    <h1>Free HD Wallpapers</h1>
    <p>Curated high-resolution backgrounds. Hover over an image to download.</p>

    <!-- The empty gallery container where images will appear -->
    <div class="gallery" id="auto-gallery">
        <!-- The JavaScript will inject all the images here automatically -->
    </div>

    <!-- The Automation Script -->
    <script>
        async function loadWallpapers() {
            const gallery = document.getElementById('auto-gallery');
            
            try {
                // Asks GitHub for the list of files in your wallpapers folder
                const response = await fetch('https://api.github.com/repos/jijin-test-lab/3d-website/contents/wallpapers');
                const files = await response.json();

                // Loop through every file it finds
                files.forEach(file => {
                    // Only load it if it's an image file (jpg, jpeg, png, gif)
                    if(file.name.match(/\.(jpe?g|png|gif)$/i)) {
                        gallery.innerHTML += `
                            <div class="wallpaper-card">
                                <img src="wallpapers/${file.name}" alt="${file.name}">
                                <a href="wallpapers/${file.name}" download class="download-btn">Download</a>
                            </div>
                        `;
                    }
                });
            } catch (error) {
                console.error("Error loading wallpapers:", error);
                gallery.innerHTML = "<p style='text-align: center;'>Error loading wallpapers. Make sure the 'wallpapers' folder exists and has images!</p>";
            }
        }

        // Run the function
        loadWallpapers();
    </script>

</body>
</html>
