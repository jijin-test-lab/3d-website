<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jijin's Wallpapers</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 40px 10%;
        }

        h1 {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #888;
            margin-bottom: 50px;
        }

        /* The Grid System */
        .gallery {
            display: grid;
            /* This automatically creates columns that fit the screen size */
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        /* The Wallpaper Card */
        .wallpaper-card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s;
        }

        .wallpaper-card:hover {
            transform: scale(1.02); /* Slight zoom when hovering */
        }

        .wallpaper-card img {
            width: 100%;
            height: 400px;
            object-fit: cover; /* Keeps images from looking stretched */
            display: block;
        }

        /* The Download Button */
        .download-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 255, 204, 0.9);
            color: #000;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            opacity: 0; /* Hidden by default */
            transition: opacity 0.3s;
        }

        /* Show the download button only when hovering over the image */
        .wallpaper-card:hover .download-btn {
            opacity: 1;
        }
    </style>
</head>
<body>

    <h1>Free HD Wallpapers</h1>
    <p>Curated high-resolution backgrounds. Hover over an image to download.</p>

   <div class="gallery" id="auto-gallery">
        <!-- The JavaScript will inject all the images here automatically -->
    </div>
        <!-- Wallpaper Item 2 -->
        <div class="wallpaper-card">
            <img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=600" alt="Cyberpunk City">
            <a href="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2560" download class="download-btn">Download 4K</a>
        </div>

        <!-- Wallpaper Item 3 -->
        <div class="wallpaper-card">
            <img src="https://images.unsplash.com/photo-1531306728370-e2ebd9d7bb99?q=80&w=600" alt="Space Galaxy">
            <a href="https://images.unsplash.com/photo-1531306728370-e2ebd9d7bb99?q=80&w=2560" download class="download-btn">Download 4K</a>
        </div>

    </div>

</body>
</html>
