<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otaku Canvas</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            /* A clean, deep gradient background instead of 3D */
            background: radial-gradient(circle at top center, #111a2e 0%, #050914 100%);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .content-wrapper {
            padding: 40px 10%;
        }

        h1 {
            text-align: center;
            font-size: 3.5rem;
            margin-bottom: 10px;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            font-weight: 800;
            text-transform: uppercase;
        }

        p {
            text-align: center;
            color: #8a9bb3;
            margin-bottom: 50px;
            font-size: 1.1rem;
        }

        /* --- THE GALLERY GRID --- */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .gallery:hover .wallpaper-card:not(:hover) {
            filter: brightness(0.3) grayscale(50%) blur(4px);
            transform: scale(0.95);
        }

        .wallpaper-card {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px;
            cursor: pointer; /* Shows a pointer to indicate it can be clicked */
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .wallpaper-card:hover {
            transform: scale(1.1);
            z-index: 10;
            border-color: rgba(0, 255, 204, 0.9);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 255, 204, 0.2);
        }

        .wallpaper-card img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
        }

        /* Small download button on the grid card */
        .download-btn {
            position: absolute;
            bottom: 25px;
            right: 25px;
            background: rgba(0, 255, 204, 0.9);
            color: #000;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            opacity: 0; 
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        .wallpaper-card:hover .download-btn {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- THE FULL SCREEN MODAL (LIGHTBOX) --- */
        .modal {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(5, 9, 20, 0.95);
            backdrop-filter: blur(15px);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            display: flex;
            opacity: 1;
        }

        .modal img {
            max-width: 90vw;
            max-height: 75vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Big download button inside the modal */
        .modal-download-btn {
            margin-top: 25px;
            background: #00ffcc;
            color: #000;
            padding: 15px 40px;
            font-size: 1.2rem;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            transition: transform 0.2s;
        }

        .modal-download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
        }

        /* Close Button */
        .close-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <h1>Otaku Canvas</h1>
        <p>Curated anime & high-resolution backgrounds. Click to view full screen.</p>

        <div class="gallery" id="auto-gallery">
            <!-- JavaScript injects images here -->
        </div>
    </div>

    <!-- The Full Screen Modal Container -->
    <div id="image-modal" class="modal" onclick="closeModal(event)">
        <span class="close-btn">&times;</span>
        <img id="modal-img" src="" alt="Full Screen Wallpaper">
        <a id="modal-download" href="" download class="modal-download-btn">Download High-Res</a>
    </div>

    <!-- AUTOMATIC WALLPAPER LOADER & MODAL LOGIC -->
    <script>
        // 1. Fetch images from GitHub
        async function loadWallpapers() {
            const gallery = document.getElementById('auto-gallery');
            
            try {
                const response = await fetch('https://api.github.com/repos/jijin-test-lab/3d-website/contents/wallpapers');
                const files = await response.json();

                files.forEach(file => {
                    if(file.name.match(/\.(jpe?g|png|gif)$/i)) {
                        const imagePath = `wallpapers/${file.name}`;
                        gallery.innerHTML += `
                            <!-- We add an onclick event to trigger the full screen view -->
                            <div class="wallpaper-card" onclick="openModal('${imagePath}')">
                                <img src="${imagePath}" alt="${file.name}">
                                <!-- StopPropagation prevents the modal from opening if they just click the small download button -->
                                <a href="${imagePath}" download class="download-btn" onclick="event.stopPropagation()">Download</a>
                            </div>
                        `;
                    }
                });
            } catch (error) {
                console.error("Error loading wallpapers:", error);
                gallery.innerHTML = "<p style='text-align: center; grid-column: 1/-1;'>Error loading wallpapers. Check if the 'wallpapers' folder exists.</p>";
            }
        }

        loadWallpapers();

        // 2. Modal (Full Screen) Logic
        const modal = document.getElementById('image-modal');
        const modalImg = document.getElementById('modal-img');
        const modalDownload = document.getElementById('modal-download');

        function openModal(imageSrc) {
            modalImg.src = imageSrc;
            modalDownload.href = imageSrc;
            modal.classList.add('show');
            document.body.style.overflow = 'hidden'; // Prevents scrolling while full screen
        }

        function closeModal(event) {
            // Close if they click the "X" OR if they click the dark background outside the image
            if (event.target === modal || event.target.className === 'close-btn') {
                modal.classList.remove('show');
                document.body.style.overflow = 'auto'; // Re-enables scrolling
            }
        }
    </script>
</body>
</html>
